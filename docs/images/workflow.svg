<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title"><title id="title">Four steps: Import, edit, create, send / Importar, editar, crear, enviar</title><rect width="1120" height="260" rx="22" fill="#171120"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#f7f0ff"><text x="560" y="36" font-size="21" font-weight="bold">From a link to a sound sticker · De un enlace a un sticker con sonido</text><rect x="24" y="66" width="250" height="151" rx="15" fill="#251b34" stroke="#503b67"/><text x="149" y="108" font-size="28" font-weight="bold" fill="#ddb5ff">01</text><text x="149" y="148" font-size="18" font-weight="bold">Importar / Import</text><text x="149" y="179" font-size="13" fill="#c0afcf">Link · Video · Audio</text><rect x="298" y="66" width="250" height="151" rx="15" fill="#251b34" stroke="#503b67"/><text x="423" y="108" font-size="28" font-weight="bold" fill="#ddb5ff">02</text><text x="423" y="148" font-size="18" font-weight="bold">Editar / Edit</text><text x="423" y="179" font-size="13" fill="#c0afcf">Trim · Crop · Zoom</text><rect x="572" y="66" width="250" height="151" rx="15" fill="#251b34" stroke="#503b67"/><text x="697" y="108" font-size="28" font-weight="bold" fill="#ddb5ff">03</text><text x="697" y="148" font-size="18" font-weight="bold">Crear / Create</text><text x="697" y="179" font-size="13" fill="#c0afcf">WebP + Ogg/Opus</text><rect x="846" y="66" width="250" height="151" rx="15" fill="#251b34" stroke="#503b67"/><text x="971" y="108" font-size="28" font-weight="bold" fill="#ddb5ff">04</text><text x="971" y="148" font-size="18" font-weight="bold">Enviar / Send</text><text x="971" y="179" font-size="13" fill="#c0afcf">WhatsApp Web</text></g></svg>