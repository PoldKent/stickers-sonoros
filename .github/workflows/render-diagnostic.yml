name: Diagnóstico público de Render
on:
  pull_request:
    paths:
      - '.github/workflows/render-diagnostic.yml'
  workflow_dispatch:
    inputs:
      social_url:
        description: 'Optional authorized public social video URL'
        required: false
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Comprobar servidor y acceso público
        shell: bash
        env:
          SOCIAL_URL: ${{ inputs.social_url }}
        run: |
          set -euo pipefail
          base=https://stickers-sonoros.onrender.com
          origin=https://poldkent.github.io
          pages=$origin/stickers-sonoros/
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          echo '### Estado de las publicaciones (versiones activas, no la rama PR)' >> "$GITHUB_STEP_SUMMARY"
          curl -fsSL --max-time 40 "$pages" -o "$tmp/pages.html"
          curl -fsSL --max-time 100 "$base/" -o "$tmp/render.html"
          python - "$tmp/pages.html" "$tmp/render.html" <<'PY'
          import re,sys
          for site,path in zip(("GitHub Pages","Render web"),sys.argv[1:]):
              html=open(path,encoding="utf-8").read()
              version=re.search(r'data-version="([^"]+)"',html)
              print(site+" version: "+(version.group(1) if version else "unknown"))
              assert 'id="export"' in html and 'id="language"' in html
          PY
          echo '### Estado público de Render' >> "$GITHUB_STEP_SUMMARY"
          curl -sS --max-time 100 -D "$tmp/health-headers" -o "$tmp/health" -H "Origin: $origin" "$base/health"
          echo 'Estado /health:'
          cat "$tmp/health-headers" "$tmp/health" 2>/dev/null
          printf '\n'
          python - "$tmp/health" "$tmp/pages.html" "$tmp/render.html" <<'PY'
          import json,re,sys
          health=json.load(open(sys.argv[1])); print('Render API version:',health.get('version'))
          versions=[re.search(r'data-version="([^"]+)"',open(p).read()) for p in sys.argv[2:]]
          if not all(v and v.group(1)==health.get('version') for v in versions): print('WARNING: publication versions differ')
          PY
          if ! python -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("publicMedia") is True else 1)' "$tmp/health"; then
            echo 'El servidor no anuncia publicMedia; revisar el despliegue o la conexión.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          curl -sS --max-time 20 -D "$tmp/options-headers" -o /dev/null -X OPTIONS -H "Origin: $origin" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$base/api/media"
          cat "$tmp/options-headers"
          status=$(curl -sS --max-time 90 --max-filesize 10000000 -D "$tmp/media-headers" -o "$tmp/media" -w '%{http_code}' -H "Origin: $origin" -H 'Content-Type: application/json' --data '{"url":"https://www.w3schools.com/html/mov_bbb.mp4"}' "$base/api/media")
          echo "Importación HTTP $status"
          cat "$tmp/media-headers" 2>/dev/null
          if [[ "$status" == 200 ]] && grep -iq '^content-type: video/mp4' "$tmp/media-headers"; then
            echo "MP4 público recibido: $(wc -c < "$tmp/media") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Importación no verificada: HTTP $status" | tee -a "$GITHUB_STEP_SUMMARY"
            if grep -iq '^content-type: application/json' "$tmp/media-headers"; then head -c 1000 "$tmp/media"; fi
            exit 1
          fi
          if [[ -z "$SOCIAL_URL" ]]; then exit 0; fi
          echo 'Comprobación del video social autorizado'
          status=$(curl -sS --max-time 180 --max-filesize 83886080 -o "$tmp/tiktok" -D "$tmp/tiktok-headers" -w '%{http_code}' -H "Origin: $origin" -H 'Content-Type: application/json' --data "$(python -c 'import json,os; print(json.dumps({"url":os.environ["SOCIAL_URL"]}))')" "$base/api/import")
          echo "Social import HTTP $status"
          if [[ "$status" == 200 ]] && grep -iq '^content-type: video/mp4' "$tmp/tiktok-headers"; then
            echo "MP4 social recibido: $(wc -c < "$tmp/tiktok") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            if grep -iq '^content-type: application/json' "$tmp/tiktok-headers"; then head -c 1000 "$tmp/tiktok"; fi
            exit 1
          fi
          exit 0
