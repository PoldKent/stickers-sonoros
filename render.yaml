services:
  - type: web
    name: stickers-sonoros
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://poldkent.github.io
      - key: API_ONLY
        value: "1"
      - key: YOUTUBE_ENGINE
        value: auto
