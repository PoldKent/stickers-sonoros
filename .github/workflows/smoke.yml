name: Verificar editor y conversor
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: python -m unittest discover -s importer -p 'test_*.py'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/sticker-http.log 2>&1 &
          trap 'kill $!' EXIT
          for n in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          node tests/smoke.mjs
