name: Verificar editor y conversor
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check app.js
          node --check i18n.js
          node --check vendor/shirtep/convert.js
          node --check vendor/shirtep/local-send.js
          node --check tests/smoke.mjs
          python -m compileall -q importer
      - run: node --test experiments/mobile-bridge/package-adapter.test.mjs
      - run: node --test experiments/mobile-bridge/web-policy.test.mjs experiments/mobile-bridge/public-policy.test.mjs
      - run: node --check experiments/mobile-bridge/private-test.mjs && node --check experiments/mobile-bridge/web-service.mjs && node --check private-mobile.js
      - run: python -m unittest discover -s importer -p 'test_*.py'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python tests/test_http.py
      - run: python -m pip install 'yt-dlp[default]'
      - run: python tests/test_format_selection.py
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/sticker-http.log 2>&1 &
          trap 'kill $!' EXIT
          for n in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          node tests/smoke.mjs

      - name: Upload interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
